server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compresión
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm font/woff font/woff2;

    # Cabeceras de seguridad
    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Assets con hash: caché agresiva
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El Service Worker y el manifest NUNCA se cachean
    location = /sw.js            { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /registerSW.js    { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location = /index.html       { add_header Cache-Control "no-cache, no-store, must-revalidate"; }

    # SPA fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
